{% extends "base.html" %}

{% block nav_news %}active{% endblock %}

{% block content %}
<section class="hero">
    <h1>Новини компанії</h1>
    <p>Слідкуйте за нашими останніми досягненнями та подіями</p>
</section>

{% for new in news %}
<article class="news-item">
    <span class="news-date">{{ new.date }}</span>
    <h3>{{ new.title }}</h3>
    <p>{{ new.content }}</p>
</article>
{% empty %}
<div class="block">
    <p>Наразі немає новин.</p>
</div>
{% endfor %}
{% endblock %}
