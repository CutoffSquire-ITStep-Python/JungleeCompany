{% extends 'base.html' %}

{% block content %}
<div class="error-page">

	<div class="error-code">
		<span class="error-digit">4</span>
		<span class="error-digit">0</span>
		<span class="error-digit">4</span>
	</div>

	<h2 class="error-title">
		{% if message %}
			{{ message|truncatechars:50 }}
		{% else %}
			Сторінку не знайдено
		{% endif %}
	</h2>


	<p class="error-hint">Здається, ви забрели у незвідану територію. Можливо, ви просто помилилися адресою.</p>

	<div class="error-actions">
		<a href="{% url 'home' %}" class="nav-link">← Повернутися додому</a>
	</div>

</div>
{% endblock %}
